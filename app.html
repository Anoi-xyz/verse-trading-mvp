<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Verse — Strategy Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.2/ethers.umd.min.js"></script>
<style>
  :root {
    --bg: #0A0A0F; --panel: #111118; --panel-2: #17171F; --edge: #24242F; --edge-soft: #1C1C26;
    --ink: #F0EFEB; --ink-mid: #9694A0; --ink-faint: #57555F;
    --lime: #C6F135; --lime-dim: #1F2708; --rose: #FF5C7A; --rose-dim: #2C0F17; --amber: #F6C453; --sky: #6FCFFF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; font-size: 14px; }
  .mono { font-family: 'IBM Plex Mono', monospace; }

  .app { display: grid; grid-template-rows: 60px 1fr; min-height: 100vh; }
  .topbar { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 1px solid var(--edge); background: var(--panel); }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .mark { width: 26px; height: 26px; background: var(--lime); border-radius: 7px; display: flex; align-items: center; justify-content: center; color: #0A0A0F; font-weight: 700; font-size: 13px; }
  .brand h1 { font-size: 15px; font-weight: 600; }
  .connect-btn { font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; background: var(--lime); color: #0A0A0F; border: none; padding: 9px 18px; border-radius: 100px; cursor: pointer; }
  .connect-btn:hover { filter: brightness(1.08); }
  .wallet-chip { display: inline-flex; align-items: center; gap: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; padding: 8px 14px; border-radius: 100px; border: 1px solid var(--edge); color: var(--ink-mid); }
  .wallet-chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--lime); }

  .body-grid { display: grid; grid-template-columns: 260px 1fr 320px; min-height: 0; }
  @media (max-width: 980px) { .body-grid { grid-template-columns: 1fr; } .sidebar, .rightpanel { border: none; } }

  .sidebar { border-right: 1px solid var(--edge); display: flex; flex-direction: column; background: var(--panel); overflow-y: auto; }
  .nav { display: flex; flex-direction: column; padding: 12px; gap: 2px; border-bottom: 1px solid var(--edge); }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; cursor: pointer; color: var(--ink-mid); font-size: 13px; font-weight: 500; background: transparent; border: none; text-align: left; font-family: 'Inter', sans-serif; }
  .nav-item:hover { background: var(--panel-2); color: var(--ink); }
  .nav-item.active { background: var(--panel-2); color: var(--ink); }
  .nav-item .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-faint); }
  .nav-item.active .dot { background: var(--lime); }

  .sb-section-head { padding: 16px 20px 8px; font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-faint); display: flex; justify-content: space-between; }
  .strategy-list { flex: 1; padding: 0 8px; }
  .strategy-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; cursor: pointer; }
  .strategy-row:hover { background: var(--panel-2); }
  .strategy-row.selected { background: var(--panel-2); box-shadow: inset 2px 0 0 var(--lime); }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .status-dot.pass { background: var(--lime); } .status-dot.fail { background: var(--rose); } .status-dot.insuf { background: var(--ink-faint); }
  .strategy-row .meta { min-width: 0; }
  .strategy-row .meta .name { font-size: 12.5px; font-weight: 500; }
  .strategy-row .meta .sub { font-size: 10.5px; color: var(--ink-faint); font-family: 'IBM Plex Mono', monospace; }
  .filter-group { display: flex; gap: 2px; background: var(--panel-2); border-radius: 8px; padding: 3px; margin: 12px; }
  .filter-btn { flex: 1; text-align: center; padding: 7px 4px; border-radius: 6px; font-size: 10.5px; font-weight: 600; cursor: pointer; color: var(--ink-faint); border: none; background: transparent; font-family: 'IBM Plex Mono', monospace; }
  .filter-btn.active { background: var(--panel); color: var(--ink); }

  .asset-picker { padding: 12px; }
  .asset-btn { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 11px 12px; border-radius: 8px; cursor: pointer; border: none; background: transparent; color: var(--ink-mid); font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; margin-bottom: 2px; }
  .asset-btn:hover { background: var(--panel-2); }
  .asset-btn.active { background: var(--panel-2); color: var(--lime); }

  .center { padding: 28px 36px; overflow-y: auto; min-width: 0; }
  .c-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 4px; flex-wrap: wrap; gap: 10px; }
  .c-title-row { display: flex; align-items: center; gap: 12px; }
  .c-title-row h2 { font-size: 22px; font-weight: 700; }
  .badge { font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 100px; display: inline-flex; align-items: center; gap: 6px; }
  .badge.pass { background: var(--lime-dim); color: var(--lime); } .badge.fail { background: var(--rose-dim); color: var(--rose); }
  .badge.insuf { background: var(--panel-2); color: var(--ink-faint); border: 1px solid var(--edge); }
  .badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .chips { display: flex; gap: 8px; }
  .chip-tag { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-mid); background: var(--panel-2); border: 1px solid var(--edge); padding: 5px 10px; border-radius: 6px; }
  .c-sub { color: var(--ink-faint); font-size: 13px; margin-bottom: 24px; }

  .canvas-card { background: var(--panel); border: 1px solid var(--edge); border-radius: 16px; padding: 28px; margin-bottom: 20px; }
  .canvas-tag { display: inline-flex; align-items: center; gap: 6px; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--ink-faint); background: var(--panel-2); border: 1px solid var(--edge); padding: 5px 10px; border-radius: 100px; margin-bottom: 20px; }
  .canvas-tag .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--sky); }

  .compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
  .compare-box { background: var(--panel-2); border: 1px solid var(--edge); border-radius: 12px; padding: 20px; }
  .compare-box .lbl { font-size: 11px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; }
  .compare-box .val { font-size: 32px; font-weight: 700; font-family: 'IBM Plex Mono', monospace; }
  .compare-box .trades { font-size: 12px; color: var(--ink-faint); margin-top: 4px; }
  .compare-box .bar-track { height: 6px; background: var(--panel); border-radius: 3px; overflow: hidden; margin-top: 14px; }
  .compare-box .bar-fill { height: 100%; border-radius: 3px; }
  .verdict-line { font-size: 13.5px; color: var(--ink-mid); line-height: 1.6; padding-top: 16px; border-top: 1px solid var(--edge); }

  .chart-wrap { height: 260px; margin-bottom: 4px; }
  .indicator-row { display: flex; gap: 24px; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--edge); flex-wrap: wrap; }
  .indicator-item .k { font-size: 10.5px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
  .indicator-item .v { font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 600; }

  .check-form { display: flex; flex-direction: column; gap: 12px; }
  .check-form .dir-toggle { display: flex; gap: 4px; background: var(--panel-2); border-radius: 8px; padding: 3px; width: fit-content; }
  .dir-btn { padding: 8px 20px; border-radius: 6px; font-size: 12.5px; font-weight: 600; cursor: pointer; border: none; background: transparent; color: var(--ink-faint); font-family: 'Inter', sans-serif; }
  .dir-btn.active.buy { background: var(--lime-dim); color: var(--lime); }
  .dir-btn.active.sell { background: var(--rose-dim); color: var(--rose); }
  .check-form textarea { background: var(--panel-2); border: 1px solid var(--edge); border-radius: 10px; padding: 12px 14px; color: var(--ink); font-family: 'Inter', sans-serif; font-size: 13px; resize: vertical; min-height: 60px; outline: none; }
  .check-form textarea:focus { border-color: var(--sky); }
  .check-actions { display: flex; gap: 10px; }
  .btn-primary { background: var(--lime); color: #0A0A0F; border: none; padding: 11px 20px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; }
  .btn-ghost { background: transparent; color: var(--ink-mid); border: 1px solid var(--edge); padding: 11px 16px; border-radius: 10px; font-size: 13px; font-weight: 500; cursor: pointer; font-family: 'Inter', sans-serif; }

  .verdict-card { border-radius: 14px; padding: 20px; margin-top: 16px; display: none; }
  .verdict-card.yes { background: linear-gradient(180deg, var(--lime-dim), transparent); border: 1px solid #2E4A0E; display: block; }
  .verdict-card.no { background: linear-gradient(180deg, var(--rose-dim), transparent); border: 1px solid #4A1A25; display: block; }
  .verdict-card.mixed { background: var(--panel-2); border: 1px solid var(--edge); display: block; }
  .verdict-card .vhead { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .verdict-card .vhead .big { font-size: 20px; font-weight: 700; }
  .verdict-card.yes .vhead .big { color: var(--lime); } .verdict-card.no .vhead .big { color: var(--rose); }
  .verdict-reason { display: flex; gap: 8px; padding: 6px 0; font-size: 13px; color: var(--ink-mid); }
  .verdict-reason .b { color: var(--ink-faint); }
  .verdict-caveat { font-size: 11.5px; color: var(--ink-faint); margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--edge-soft); line-height: 1.6; }
  .verdict-caveat a { color: var(--sky); }

  .trade-card { border: 1px solid var(--edge); border-radius: 16px; background: var(--panel); max-width: 400px; padding: 24px; }
  .trade-tabs { display: flex; gap: 4px; background: var(--panel-2); border-radius: 8px; padding: 3px; margin-bottom: 16px; }
  .trade-tab { flex: 1; text-align: center; padding: 8px; border-radius: 6px; font-size: 12.5px; font-weight: 600; cursor: pointer; color: var(--ink-faint); border: none; background: transparent; font-family: 'Inter', sans-serif; }
  .trade-tab.active { background: var(--panel); color: var(--ink); }
  .in-box { background: var(--panel-2); border: 1px solid var(--edge); border-radius: 10px; padding: 14px; margin-bottom: 6px; }
  .in-box .lr { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-faint); margin-bottom: 8px; }
  .in-box .row { display: flex; align-items: center; gap: 8px; }
  .in-box input { flex: 1; background: transparent; border: none; outline: none; color: var(--ink); font-family: 'IBM Plex Mono', monospace; font-size: 18px; min-width: 0; }
  .tok-pill { font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; background: var(--panel); border: 1px solid var(--edge); padding: 6px 10px; border-radius: 100px; }
  .swap-btn { width: 100%; padding: 13px; border-radius: 10px; border: none; font-size: 13.5px; font-weight: 600; cursor: pointer; margin-top: 10px; font-family: 'Inter', sans-serif; }
  .swap-btn.buy { background: var(--lime); color: #0A0A0F; } .swap-btn.sell { background: var(--rose); color: #1a0509; }
  .swap-btn:disabled { background: var(--edge); color: var(--ink-faint); cursor: not-allowed; }
  .tx-status { margin-top: 12px; padding: 10px 12px; border-radius: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; display: none; }
  .tx-status.pending { background: rgba(246,196,83,0.1); color: var(--amber); display: block; }
  .tx-status.success { background: var(--lime-dim); color: var(--lime); display: block; }
  .tx-status.error { background: var(--rose-dim); color: var(--rose); display: block; }
  .tx-status a { color: inherit; }

  .rightpanel { border-left: 1px solid var(--edge); padding: 24px; background: var(--panel); overflow-y: auto; }
  .rp-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .rp-head h3 { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-faint); }
  .rp-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-faint); }
  .gauge-card { border-radius: 14px; padding: 24px 20px; text-align: center; margin: 14px 0 20px; }
  .gauge-card.pass { background: linear-gradient(180deg, var(--lime-dim), transparent); border: 1px solid #2E4A0E; }
  .gauge-card.fail { background: linear-gradient(180deg, var(--rose-dim), transparent); border: 1px solid #4A1A25; }
  .gauge-card.insuf { background: var(--panel-2); border: 1px solid var(--edge); }
  .gauge-wrap { position: relative; width: 96px; height: 96px; margin: 8px auto 14px; }
  .gauge-wrap svg { transform: rotate(-90deg); }
  .gauge-wrap .pct { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; font-size: 18px; font-weight: 600; }
  .gauge-card .status-text { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
  .gauge-card .status-sub { font-size: 11.5px; color: var(--ink-faint); }
  .check-row { display: flex; align-items: flex-start; gap: 10px; padding: 11px 0; border-top: 1px solid var(--edge-soft); }
  .check-row:first-child { border-top: none; }
  .check-icon { width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; margin-top: 1px; font-family: 'IBM Plex Mono', monospace; }
  .check-icon.pass { background: var(--lime-dim); color: var(--lime); } .check-icon.fail { background: var(--rose-dim); color: var(--rose); }
  .check-body { flex: 1; min-width: 0; }
  .check-name { font-size: 12.5px; font-weight: 500; }
  .check-sub { font-size: 10.5px; color: var(--ink-faint); font-family: 'IBM Plex Mono', monospace; margin-top: 2px; }
  .check-val { font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--ink-mid); flex-shrink: 0; }
  .wallet-mini { background: var(--panel-2); border: 1px solid var(--edge); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .wallet-mini .lr { display: flex; justify-content: space-between; font-size: 12px; padding: 6px 0; }
  .wallet-mini .lr .k { color: var(--ink-faint); }
  .footlink { font-size: 11px; color: var(--ink-faint); margin-top: 20px; }
  .footlink a { color: var(--sky); }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(5,5,8,0.75); z-index: 50; align-items: center; justify-content: center; padding: 20px; }
  .modal-overlay.open { display: flex; }
  .modal-box { background: var(--panel); border: 1px solid var(--edge); border-radius: 16px; padding: 24px; width: 380px; max-width: 100%; }
  .modal-box h3 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .modal-box .sub { font-size: 12px; color: var(--ink-faint); margin-bottom: 16px; }
  .modal-close { margin-top: 14px; text-align: center; font-size: 12px; color: var(--ink-faint); cursor: pointer; padding: 8px; }
  .picker-item { display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 10px; cursor: pointer; font-size: 13px; }
  .picker-item:hover { background: var(--panel-2); }
  .picker-item img { width: 22px; height: 22px; border-radius: 5px; }
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="brand"><div class="mark">V</div><h1>Verse</h1></div>
    <div>
      <button class="connect-btn" id="connectBtnTop" onclick="openPicker()">Connect wallet</button>
      <span class="wallet-chip" id="walletChipTop" style="display:none"><span class="dot"></span><span id="walletAddrTop"></span></span>
    </div>
  </div>

  <div class="body-grid">
    <div class="sidebar" id="sidebar"></div>
    <div class="center" id="centerArea"></div>
    <div class="rightpanel" id="rightPanel"></div>
  </div>

</div>

<div class="modal-overlay" id="pickerOverlay">
  <div class="modal-box">
    <h3>Choose a wallet</h3>
    <div id="providerList"></div>
    <div class="modal-close" onclick="closePicker()">Cancel</div>
  </div>
</div>

<div class="modal-overlay" id="recommendOverlay">
  <div class="modal-box">
    <h3>Recommended read</h3>
    <div class="sub">No strategy entered — here's what the current indicators say.</div>
    <div id="recommendBody"></div>
    <div class="modal-close" onclick="closeRecommend()">Close</div>
  </div>
</div>

<script>
  const results = [
    { asset: 'BTC', strategy: 'sma-5-20', inPnl: 58.48, outPnl: -18.85, inTrades: 10, outTrades: 9 },
    { asset: 'BTC', strategy: 'sma-10-30', inPnl: 57.54, outPnl: -22.91, inTrades: 7, outTrades: 6 },
    { asset: 'BTC', strategy: 'rsi-14-30-70', inPnl: 16.62, outPnl: -28.11, inTrades: 3, outTrades: 3 },
    { asset: 'BTC', strategy: 'rsi-21-25-75', inPnl: null, outPnl: -0.44, inTrades: 0, outTrades: 2 },
    { asset: 'BTC', strategy: 'trend-vol-filter', inPnl: null, outPnl: null, inTrades: 0, outTrades: 0 },
    { asset: 'ETH', strategy: 'sma-5-20', inPnl: 18.6, outPnl: -34.46, inTrades: 10, outTrades: 11 },
    { asset: 'ETH', strategy: 'sma-10-30', inPnl: 16.6, outPnl: -23.11, inTrades: 5, outTrades: 8 },
    { asset: 'ETH', strategy: 'rsi-14-30-70', inPnl: -25.99, outPnl: -26.63, inTrades: 3, outTrades: 4 },
    { asset: 'ETH', strategy: 'rsi-21-25-75', inPnl: null, outPnl: -13.43, inTrades: 0, outTrades: 1 },
    { asset: 'ETH', strategy: 'trend-vol-filter', inPnl: 11.36, outPnl: null, inTrades: 2, outTrades: 0 },
    { asset: 'LINK', strategy: 'sma-5-20', inPnl: 5.13, outPnl: -46.04, inTrades: 11, outTrades: 10 },
    { asset: 'LINK', strategy: 'sma-10-30', inPnl: 25.5, outPnl: -25.79, inTrades: 7, outTrades: 5 },
    { asset: 'LINK', strategy: 'rsi-14-30-70', inPnl: -8.97, outPnl: -33.37, inTrades: 3, outTrades: 3 },
    { asset: 'LINK', strategy: 'rsi-21-25-75', inPnl: 18.04, outPnl: 50.02, inTrades: 1, outTrades: 2 },
    { asset: 'LINK', strategy: 'trend-vol-filter', inPnl: null, outPnl: null, inTrades: 0, outTrades: 0 },
    { asset: 'UNI', strategy: 'sma-5-20', inPnl: 0.83, outPnl: -11.7, inTrades: 1, outTrades: 3 },
    { asset: 'UNI', strategy: 'sma-10-30', inPnl: null, outPnl: -4.57, inTrades: 0, outTrades: 1 },
    { asset: 'UNI', strategy: 'rsi-14-30-70', inPnl: null, outPnl: null, inTrades: 0, outTrades: 0 },
    { asset: 'UNI', strategy: 'rsi-21-25-75', inPnl: null, outPnl: null, inTrades: 0, outTrades: 0 },
    { asset: 'UNI', strategy: 'trend-vol-filter', inPnl: null, outPnl: null, inTrades: 0, outTrades: 0 },
    { asset: 'AAVE', strategy: 'sma-5-20', inPnl: 60.54, outPnl: -45.95, inTrades: 10, outTrades: 11 },
    { asset: 'AAVE', strategy: 'sma-10-30', inPnl: 94.1, outPnl: -19.03, inTrades: 6, outTrades: 7 },
    { asset: 'AAVE', strategy: 'rsi-14-30-70', inPnl: -19.97, outPnl: -7.21, inTrades: 2, outTrades: 5 },
    { asset: 'AAVE', strategy: 'rsi-21-25-75', inPnl: null, outPnl: -23.32, inTrades: 0, outTrades: 1 },
    { asset: 'AAVE', strategy: 'trend-vol-filter', inPnl: null, outPnl: null, inTrades: 0, outTrades: 0 },
  ];
  function rid(r) { return r.asset + '-' + r.strategy; }
  function verdictFor(r) {
    if (r.outTrades < 5 || r.inTrades < 5 || r.outPnl === null || r.inPnl === null) return 'insuf';
    return (r.inPnl > 0 && r.outPnl > 0) ? 'pass' : 'fail';
  }
  function fmtPct(v) { if (v === null || v === undefined) return '—'; return (v >= 0 ? '+' : '') + v.toFixed(1) + '%'; }
  function getChecks(r) {
    const c1 = r.inTrades >= 5, c2 = r.outTrades >= 5, c3 = r.inPnl !== null && r.inPnl > 0, c4 = r.outPnl !== null && r.outPnl > 0;
    return [
      { name: 'In-sample sample size', sub: 'min. 5 closed trades', pass: c1, val: r.inTrades + ' trades' },
      { name: 'Out-of-sample sample size', sub: 'min. 5 closed trades', pass: c2, val: r.outTrades + ' trades' },
      { name: 'In-sample realized profit', sub: 'closed trades only', pass: c3, val: fmtPct(r.inPnl) },
      { name: 'Out-of-sample realized profit', sub: 'closed trades only', pass: c4, val: fmtPct(r.outPnl) },
      { name: 'Accounting method', sub: 'open positions excluded', pass: true, val: 'verified' },
    ];
  }

  const ASSETS = [
    { symbol: 'BTC', pair: 'BTCUSDT' }, { symbol: 'ETH', pair: 'ETHUSDT' }, { symbol: 'LINK', pair: 'LINKUSDT' },
    { symbol: 'UNI', pair: 'UNIUSDT' }, { symbol: 'AAVE', pair: 'AAVEUSDT' },
  ];

  function computeState(closes) {
    const sma10 = sma(closes, 10), sma30 = sma(closes, 30), rsiVal = rsi(closes, 14);
    const lastClose = closes[closes.length-1];
    const trend = (sma30 !== null && lastClose > sma30) ? 'up' : 'down';
    return { sma10, sma30, rsiVal, lastClose, trend };
  }

  function evaluateStrategy(direction, state) {
    const reasons = [];
    let supportive = 0, against = 0;
    if (direction === 'buy') {
      if (state.trend === 'up') { supportive++; reasons.push(`Price ($${state.lastClose.toFixed(2)}) is above its 30-day average — the trend supports buying.`); }
      else { against++; reasons.push(`Price ($${state.lastClose.toFixed(2)}) is below its 30-day average — the trend argues against buying now.`); }
      if (state.rsiVal !== null && state.rsiVal < 30) { supportive++; reasons.push(`RSI is ${state.rsiVal.toFixed(0)} (oversold) — often a bounce setup, supports buying.`); }
      else if (state.rsiVal !== null && state.rsiVal > 70) { against++; reasons.push(`RSI is ${state.rsiVal.toFixed(0)} (overbought) — buying here means chasing strength, risk of pullback.`); }
      else if (state.rsiVal !== null) { reasons.push(`RSI is ${state.rsiVal.toFixed(0)} (neutral) — no strong momentum signal either way.`); }
    } else {
      if (state.trend === 'down') { supportive++; reasons.push(`Price ($${state.lastClose.toFixed(2)}) is below its 30-day average — the trend supports selling.`); }
      else { against++; reasons.push(`Price ($${state.lastClose.toFixed(2)}) is above its 30-day average — the trend argues against selling now.`); }
      if (state.rsiVal !== null && state.rsiVal > 70) { supportive++; reasons.push(`RSI is ${state.rsiVal.toFixed(0)} (overbought) — often a pullback setup, supports selling.`); }
      else if (state.rsiVal !== null && state.rsiVal < 30) { against++; reasons.push(`RSI is ${state.rsiVal.toFixed(0)} (oversold) — selling here means chasing weakness.`); }
      else if (state.rsiVal !== null) { reasons.push(`RSI is ${state.rsiVal.toFixed(0)} (neutral) — no strong momentum signal either way.`); }
    }
    const v = supportive > against ? 'yes' : supportive < against ? 'no' : 'mixed';
    return { verdict: v, reasons };
  }

  async function loadChartForAsset(symbol) {
    const timeframeData = CHART_DATA[symbol]?.[selectedInterval] || [];
    const chartWrap = document.querySelector('.chart-wrap');
    const row = document.getElementById('indicatorRow');
    simResult = null;

    if (timeframeData.length < 15) {
      if (chartWrap) chartWrap.innerHTML = `<span class="mono" style="color:var(--ink-faint)">No price data available for ${symbol} at this timeframe.</span>`;
      if (row) row.innerHTML = `<span class="mono" style="color:var(--ink-faint)">—</span>`;
      lastIndicatorState = null;
      lastTimeframeData = null;
      renderSimArea();
      return;
    }

    lastTimeframeData = timeframeData;
    const closes = timeframeData.map(p => p.close);
    lastIndicatorState = computeState(closes);
    try {
      drawChart(timeframeData);
    } catch (err) {
      if (chartWrap) chartWrap.innerHTML = `<span class="mono" style="color:var(--rose)">Chart failed to render: ${err.message}</span>`;
    }
    renderIndicatorRow(lastIndicatorState);
    renderSimArea();
  }

  function drawChart(points) {
    const canvas = document.getElementById('priceChartCanvas');
    if (!canvas) return;
    const wrap = canvas.parentElement;
    const width = wrap.clientWidth || 600;
    const height = 260;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    ctx.clearRect(0, 0, width, height);

    // fall back gracefully if a point is missing OHLC (shouldn't happen post-export, but be safe)
    const usable = points.filter(p => p.open != null && p.high != null && p.low != null && p.close != null);
    if (usable.length < 2) {
      ctx.fillStyle = '#57555F';
      ctx.font = '11px IBM Plex Mono, monospace';
      ctx.fillText('Not enough data to render candles.', 8, height / 2);
      return;
    }

    const highs = usable.map(p => p.high), lows = usable.map(p => p.low);
    const min = Math.min(...lows), max = Math.max(...highs);
    const range = (max - min) || 1;
    const padL = 8, padR = 8, padT = 12, padB = 12;
    const plotW = width - padL - padR, plotH = height - padT - padB;
    const n = usable.length;
    const slot = plotW / n;
    const bodyW = Math.max(1, Math.min(slot * 0.62, 10));
    const y = (v) => padT + plotH - ((v - min) / range) * plotH;

    // gridlines
    ctx.strokeStyle = '#1C1C26';
    ctx.lineWidth = 1;
    for (let i = 0; i <= 4; i++) {
      const gy = padT + (plotH / 4) * i;
      ctx.beginPath(); ctx.moveTo(padL, gy); ctx.lineTo(width - padR, gy); ctx.stroke();
    }

    const LIME = '#C6F135', ROSE = '#FF5C7A';

    usable.forEach((p, i) => {
      const cx = padL + slot * i + slot / 2;
      const up = p.close >= p.open;
      const color = up ? LIME : ROSE;

      // wick (high-low)
      ctx.strokeStyle = color;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(cx, y(p.high));
      ctx.lineTo(cx, y(p.low));
      ctx.stroke();

      // body (open-close)
      const yOpen = y(p.open), yClose = y(p.close);
      const bodyTop = Math.min(yOpen, yClose);
      const bodyH = Math.max(1, Math.abs(yClose - yOpen));
      ctx.fillStyle = color;
      ctx.fillRect(cx - bodyW / 2, bodyTop, bodyW, bodyH);
    });

    // min/max labels
    ctx.fillStyle = '#57555F';
    ctx.font = '10px IBM Plex Mono, monospace';
    ctx.fillText('$' + max.toFixed(max < 10 ? 4 : 2), padL, padT + 4);
    ctx.fillText('$' + min.toFixed(min < 10 ? 4 : 2), padL, height - 2);
  }

  function enterSimTrade() {
    if (!lastTimeframeData || lastTimeframeData.length < 2) return;
    const entry = lastTimeframeData[0].close;

    const pnlPct = checkDirection === 'buy' ? ((exit - entry) / entry) * 100 : ((entry - exit) / entry) * 100;
    const pnlAmt = simAmount * (pnlPct / 100);
    simResult = { entry, exit, pnlPct, pnlAmt, direction: checkDirection, token: selectedAsset, amount: simAmount, tf: selectedInterval };
    renderSimArea();
  }

            <div class="vhead"><span class="big" style="color:${up ? 'var(--lime)' : 'var(--rose)'}">${up ? '+' : ''}${simResult.pnlPct.toFixed(2)}%</span>
              <span class="mono" style="color:var(--ink-faint);font-size:12px">— ${simResult.direction.toUpperCase()} ${simResult.token} · ${simResult.tf}</span></div>
            <div class="verdict-reason"><span class="b">·</span><span>Entry $${simResult.entry.toFixed(simResult.entry<10?4:2)} → now $${simResult.exit.toFixed(simResult.exit<10?4:2)}, on ${simResult.amount} ${simResult.token}: ${up?'+':''}${simResult.pnlAmt.toFixed(4)} ${simResult.token}.</span></div>
            <div class="verdict-caveat">Simulated: measures the move across the currently loaded ${simResult.tf} window on baked historical data — not a live position or the real Sepolia pool.</div>
          </div>
        ` : ''}
      </div>
    `;
  }

  function renderCheckForm() {
    document.getElementById('dirBuy')?.classList.toggle('active', checkDirection==='buy');
    document.getElementById('dirBuy')?.classList.toggle('buy', checkDirection==='buy');
    document.getElementById('dirSell')?.classList.toggle('active', checkDirection==='sell');
    document.getElementById('dirSell')?.classList.toggle('sell', checkDirection==='sell');
  }

  function runCheck() {
    if (!lastIndicatorState) return;
    const { verdict, reasons } = evaluateStrategy(checkDirection, lastIndicatorState);
    const area = document.getElementById('verdictArea');
    area.innerHTML = `
      <div class="verdict-card ${verdict}">
        <div class="vhead"><span class="big">${verdict==='yes'?'Yes':verdict==='no'?'No':'Mixed'}</span><span class="mono" style="color:var(--ink-faint);font-size:12px">— ${checkDirection.toUpperCase()} ${selectedAsset}</span></div>
        ${reasons.map(r => `<div class="verdict-reason"><span class="b">·</span><span>${r}</span></div>`).join('')}
        <div class="verdict-caveat">These are the same SMA/RSI-style signals tested in the <a onclick="setSection('strategies')" style="cursor:pointer">Strategies tab</a> — our own validation found none held up on unseen data. Treat this as a directional read, not proven edge.</div>
      </div>
    `;
  }

  function showRecommend() {
    if (!lastIndicatorState) return;
    const s = lastIndicatorState;
    const rsiHigh = s.rsiVal !== null && s.rsiVal > 70;
    const rsiLow = s.rsiVal !== null && s.rsiVal < 30;
    const priceStr = '$' + s.lastClose.toFixed(s.lastClose < 10 ? 4 : 2);
    const rsiStr = s.rsiVal !== null ? s.rsiVal.toFixed(0) : '—';
    let title, color, detail;

    if (s.trend === 'up' && rsiHigh) {
      title = 'Conflicting signals — uptrend, overbought';
      color = 'var(--ink-mid)';
      detail = `${selectedAsset} is trading above its 30-day average (uptrend) while RSI sits at ${rsiStr} — deep overbought territory. Trend says momentum is still with buyers; RSI says that momentum may be stretched and due a pullback. The two disagree, which is itself the signal here.`;
    } else if (s.trend === 'down' && rsiLow) {
      title = 'Conflicting signals — downtrend, oversold';
      color = 'var(--ink-mid)';
      detail = `${selectedAsset} is trading below its 30-day average (downtrend) while RSI sits at ${rsiStr} — deep oversold territory. Trend says sellers are still in control; RSI says the move may be overextended and due a bounce. The two disagree, which is itself the signal here.`;
    } else if (s.trend === 'up') {
      title = 'Leaning Buy';
      color = 'var(--lime)';
      detail = `${selectedAsset} at ${priceStr} is above its 30-day average, and RSI (${rsiStr}) isn't flashing overbought — trend and momentum both point the same direction, toward buying.`;
    } else {
      title = 'Leaning Sell';
      color = 'var(--rose)';
      detail = `${selectedAsset} at ${priceStr} is below its 30-day average, and RSI (${rsiStr}) isn't flashing oversold — trend and momentum both point the same direction, toward selling.`;
    }

    document.getElementById('recommendBody').innerHTML = `
      <div class="verdict-card mixed" style="display:block">
        <div class="vhead"><span class="big" style="font-size:15px;color:${color}">${title}</span></div>
        <div class="verdict-reason"><span class="b">·</span><span>${detail}</span></div>
        <div class="verdict-caveat">This read comes from the same signals our own validation testing found do not have proven edge. Use it as a starting point, not a signal to act on alone.</div>
      </div>
    `;
    document.getElementById('recommendOverlay').classList.add('open');
  }
  function closeRecommend() { document.getElementById('recommendOverlay').classList.remove('open'); }

  function tradeCenterHTML() {
    return `
      <div class="c-header"><div class="c-title-row"><h2>Trade</h2><span class="badge insuf"><span class="dot"></span>Sepolia testnet</span></div></div>
      <p class="c-sub">Secondary feature. A real Uniswap v2 pool, verified on-chain against the Factory contract. No real funds.</p>
      <div class="trade-card">
        <div class="trade-tabs"><button class="trade-tab active" id="tabBuy" onclick="setMode('buy')">Buy</button><button class="trade-tab" id="tabSell" onclick="setMode('sell')">Sell</button></div>
        <div class="in-box"><div class="lr"><span>You pay</span><span id="fromBalance">Balance —</span></div><div class="row"><input type="number" id="amountIn" placeholder="0.0" oninput="onAmountChange()" min="0" step="any" /><span class="tok-pill" id="fromToken">ETH</span></div></div>
        <div class="in-box"><div class="lr"><span>Estimated receive</span><span id="toBalance">Balance —</span></div><div class="row"><input type="text" id="amountOut" placeholder="0.0" disabled /><span class="tok-pill" id="toToken">tUSDT</span></div></div>
        <button class="swap-btn buy" id="swapBtn" onclick="executeSwap()" disabled>Connect wallet to trade</button>
        <div class="tx-status" id="txStatus"></div>
      </div>
    `;
  }

  function renderRight() {
    const right = document.getElementById('rightPanel');
    if (section === 'trade') { right.innerHTML = walletRightHTML(); updateWalletMini(); return; }
    if (section === 'check') { right.innerHTML = checkRightHTML(); return; }
    const r = results.find((x) => rid(x) === selectedId) || results[0];
    const v = verdictFor(r);
    const checks = getChecks(r);
    const passedCount = checks.filter((c) => c.pass).length;
    const pct = Math.round((passedCount / checks.length) * 100);
    const ringColor = v==='pass'?'var(--lime)':v==='fail'?'var(--rose)':'var(--ink-faint)';
    const circumference = 2*Math.PI*40, offset = circumference - (pct/100)*circumference;
    right.innerHTML = `
      <div class="rp-head"><h3>Validation checks</h3><span class="rp-count mono">${passedCount}/${checks.length}</span></div>
      <div class="gauge-card ${v}">
        <div class="gauge-wrap"><svg width="96" height="96" viewBox="0 0 96 96"><circle cx="48" cy="48" r="40" fill="none" stroke="var(--edge)" stroke-width="8" /><circle cx="48" cy="48" r="40" fill="none" stroke="${ringColor}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${circumference}" stroke-dashoffset="${offset}" /></svg><div class="pct" style="color:${ringColor}">${pct}%</div></div>
        <div class="status-text">${v==='pass'?'Validated':v==='fail'?'Rejected':'Inconclusive'}</div>
        <div class="status-sub">${passedCount} of ${checks.length} checks passed</div>
      </div>
      <div>${checks.map((c)=>`<div class="check-row"><div class="check-icon ${c.pass?'pass':'fail'}">${c.pass?'✓':'✗'}</div><div class="check-body"><div class="check-name">${c.name}</div><div class="check-sub">${c.sub}</div></div><div class="check-val">${c.val}</div></div>`).join('')}</div>
      <p class="footlink">Source: <a href="https://github.com/Anoi-xyz/verse-trading-mvp">github.com/Anoi-xyz/verse-trading-mvp</a></p>
    `;
  }

  function checkRightHTML() {
    return `
      <div class="rp-head"><h3>How this works</h3></div>
      <div class="wallet-mini">
        <div class="lr"><span class="k">Data source</span><span>Yahoo Finance, daily</span></div>
        <div class="lr"><span class="k">Trend signal</span><span>Price vs 30d SMA</span></div>
        <div class="lr"><span class="k">Momentum signal</span><span>RSI (14)</span></div>
      </div>
      <p class="footlink">This check is fully transparent — no hidden model, just the two indicators shown above, computed live from real data. It agrees or disagrees with your Buy/Sell call and shows its work. See the <span onclick="setSection('strategies')" style="cursor:pointer;color:var(--sky)">Strategies tab</span> for why these particular signals shouldn't be trusted blindly.</p>
    `;
  }

  function walletRightHTML() {
    return `
      <div class="rp-head"><h3>Wallet</h3></div>
      <div class="wallet-mini" id="walletMini"><div class="lr"><span class="k">Status</span><span id="wStatusMini">Not connected</span></div></div>
      <p class="footlink">Use the Connect wallet button top-right. Get free test ETH from the <a href="https://www.alchemy.com/faucets/ethereum-sepolia" target="_blank">Sepolia faucet</a>.</p>
    `;
  }
  function updateWalletMini() {
    const el = document.getElementById('wStatusMini');
    if (el && userAddress) el.textContent = userAddress.slice(0,6) + '…' + userAddress.slice(-4);
  }

  renderAll();

  const discoveredProviders = [];
  window.addEventListener('eip6963:announceProvider', (e) => discoveredProviders.push(e.detail));
  window.dispatchEvent(new Event('eip6963:requestProvider'));

  function openPicker() {
    setTimeout(() => {
      const list = document.getElementById('providerList');
      list.innerHTML = '';
      if (discoveredProviders.length === 0) {
        if (window.ethereum) { connectWithProvider(window.ethereum); } else { alert('No wallet found. Install MetaMask or another browser wallet.'); }
        return;
      }
      if (discoveredProviders.length === 1) { connectWithProvider(discoveredProviders[0].provider); return; }
      discoveredProviders.forEach((p) => {
        const item = document.createElement('div');
        item.className = 'picker-item';
        item.innerHTML = `<img src="${p.info.icon}" /><span>${p.info.name}</span>`;
        item.onclick = () => connectWithProvider(p.provider);
        list.appendChild(item);
      });
      document.getElementById('pickerOverlay').classList.add('open');
    }, 150);
  }
  function closePicker() { document.getElementById('pickerOverlay').classList.remove('open'); }

  const ROUTER = '0xC532a74256D3Db42D0Bf7a0400fEFDbad7694008';
  const WETH = '0x7b79995e5f793A07Bc00c21412e50Ecae098E7f9';
  const TOKEN = '0xdD56d48Af84419F5d77dB4F190ee5BBA50073E77';
  const ROUTER_ABI = [
    'function getAmountsOut(uint amountIn, address[] calldata path) external view returns (uint[] memory amounts)',
    'function swapExactETHForTokens(uint amountOutMin, address[] calldata path, address to, uint deadline) external payable returns (uint[] memory amounts)',
    'function swapExactTokensForETH(uint amountIn, uint amountOutMin, address[] calldata path, address to, uint deadline) external returns (uint[] memory amounts)',
  ];
  const ERC20_ABI = [
    'function balanceOf(address) view returns (uint256)', 'function decimals() view returns (uint8)',
    'function symbol() view returns (string)', 'function approve(address,uint256) returns (bool)',
    'function allowance(address,address) view returns (uint256)',
  ];
  let provider, signer, userAddress, mode = 'buy', tokenDecimals = 18, tokenSymbol = 'TOKEN', quoteTimer = null;

  async function connectWithProvider(injected) {
    closePicker();
    try {
      const accounts = await injected.request({ method: 'eth_requestAccounts' });
      provider = new ethers.BrowserProvider(injected);
      signer = await provider.getSigner();
      userAddress = accounts[0];
      document.getElementById('connectBtnTop').style.display = 'none';
      document.getElementById('walletChipTop').style.display = 'inline-flex';
      document.getElementById('walletAddrTop').textContent = userAddress.slice(0,6) + '…' + userAddress.slice(-4);
      await loadTokenMeta();
      await refreshBalances();
      updateSwapBtnState();
      updateWalletMini();
      injected.on && injected.on('accountsChanged', () => location.reload());
      injected.on && injected.on('chainChanged', () => location.reload());
    } catch (err) { console.error(err); }
  }

  function bindTradeEvents() { updateSwapBtnState(); if (signer) refreshBalances(); }

  function setMode(m) {
    mode = m;
    document.getElementById('tabBuy').classList.toggle('active', m==='buy');
    document.getElementById('tabSell').classList.toggle('active', m==='sell');
    document.getElementById('fromToken').textContent = m==='buy' ? 'ETH' : tokenSymbol;
    document.getElementById('toToken').textContent = m==='buy' ? tokenSymbol : 'ETH';
    document.getElementById('swapBtn').className = 'swap-btn ' + m;
    document.getElementById('amountIn').value = ''; document.getElementById('amountOut').value = '';
    updateSwapBtnState();
  }

  async function loadTokenMeta() {
    const token = new ethers.Contract(TOKEN, ERC20_ABI, provider);
    tokenDecimals = await token.decimals(); tokenSymbol = await token.symbol();
    const toTok = document.getElementById('toToken'); if (toTok) toTok.textContent = mode==='buy' ? tokenSymbol : 'ETH';
  }

  async function refreshBalances() {
    if (!provider || !userAddress) return;
    const ethBal = await provider.getBalance(userAddress);
    const token = new ethers.Contract(TOKEN, ERC20_ABI, provider);
    const tokenBal = await token.balanceOf(userAddress);
    const ethStr = Number(ethers.formatEther(ethBal)).toFixed(4) + ' ETH';
    const tokenStr = Number(ethers.formatUnits(tokenBal, tokenDecimals)).toFixed(2) + ' ' + tokenSymbol;
    const fb = document.getElementById('fromBalance'), tb = document.getElementById('toBalance');
    if (fb) fb.textContent = 'Balance ' + (mode==='buy'?ethStr:tokenStr);
    if (tb) tb.textContent = 'Balance ' + (mode==='buy'?tokenStr:ethStr);
  }

  function updateSwapBtnState() {
    const btn = document.getElementById('swapBtn'); if (!btn) return;
    if (!signer) { btn.disabled = true; btn.textContent = 'Connect wallet to trade'; return; }
    const amt = document.getElementById('amountIn').value;
    if (!amt || Number(amt) <= 0) { btn.disabled = true; btn.textContent = 'Enter an amount'; return; }
    btn.disabled = false; btn.textContent = mode==='buy' ? `Buy ${tokenSymbol}` : `Sell ${tokenSymbol}`;
  }

  function onAmountChange() { updateSwapBtnState(); clearTimeout(quoteTimer); quoteTimer = setTimeout(getQuote, 400); }

  async function getQuote() {
    const amt = document.getElementById('amountIn').value;
    if (!amt || Number(amt) <= 0 || !provider) { document.getElementById('amountOut').value = ''; return; }
    try {
      const router = new ethers.Contract(ROUTER, ROUTER_ABI, provider);
      if (mode === 'buy') {
        const amounts = await router.getAmountsOut(ethers.parseEther(amt), [WETH, TOKEN]);
        document.getElementById('amountOut').value = Number(ethers.formatUnits(amounts[1], tokenDecimals)).toFixed(4);
      } else {
        const amounts = await router.getAmountsOut(ethers.parseUnits(amt, tokenDecimals), [TOKEN, WETH]);
        document.getElementById('amountOut').value = Number(ethers.formatEther(amounts[1])).toFixed(6);
      }
    } catch (err) { document.getElementById('amountOut').value = ''; }
  }

  function showStatus(type, html) { const el = document.getElementById('txStatus'); if (el) { el.className = 'tx-status ' + type; el.innerHTML = html; } }

  async function executeSwap() {
    const amt = document.getElementById('amountIn').value;
    if (!amt || Number(amt) <= 0) return;
    document.getElementById('swapBtn').disabled = true;
    try {
      const router = new ethers.Contract(ROUTER, ROUTER_ABI, signer);
      const deadline = Math.floor(Date.now()/1000) + 600;
      if (mode === 'buy') {
        const amountIn = ethers.parseEther(amt);
        const amounts = await router.getAmountsOut(amountIn, [WETH, TOKEN]);
        const minOut = (amounts[1]*95n)/100n;
        showStatus('pending', 'Confirm in your wallet…');
        const tx = await router.swapExactETHForTokens(minOut, [WETH, TOKEN], userAddress, deadline, { value: amountIn });
        showStatus('pending', `Sent: ${tx.hash}<br>Waiting…`);
        const receipt = await tx.wait();
        showStatus('success', `Confirmed, block ${receipt.blockNumber}<br><a href="https://sepolia.etherscan.io/tx/${receipt.hash}" target="_blank">View on Etherscan →</a>`);
      } else {
        const amountIn = ethers.parseUnits(amt, tokenDecimals);
        const token = new ethers.Contract(TOKEN, ERC20_ABI, signer);
        if ((await token.allowance(userAddress, ROUTER)) < amountIn) { showStatus('pending','Approving…'); await (await token.approve(ROUTER, amountIn)).wait(); }
        const amounts = await router.getAmountsOut(amountIn, [TOKEN, WETH]);
        const minOut = (amounts[1]*95n)/100n;
        showStatus('pending', 'Confirm in your wallet…');
        const tx = await router.swapExactTokensForETH(amountIn, minOut, [TOKEN, WETH], userAddress, deadline);
        showStatus('pending', `Sent: ${tx.hash}<br>Waiting…`);
        const receipt = await tx.wait();
        showStatus('success', `Confirmed, block ${receipt.blockNumber}<br><a href="https://sepolia.etherscan.io/tx/${receipt.hash}" target="_blank">View on Etherscan →</a>`);
      }
      document.getElementById('amountIn').value = ''; document.getElementById('amountOut').value = '';
      await refreshBalances();
    } catch (err) { showStatus('error', 'Failed: ' + (err.reason || err.message || 'unknown')); }
    updateSwapBtnState();
  }
</script>
</body>
</html>
